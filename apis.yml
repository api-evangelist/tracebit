aid: tracebit
name: Tracebit
description: >-
  Tracebit is a security-canary (deception) platform backed by Accel. It deploys
  realistic decoy credentials, secrets, and identities — canaries — across AWS,
  Azure, Google Cloud, Okta, Kubernetes, CI/CD pipelines, and workstations, and
  raises high-fidelity alerts the moment an attacker touches one during lateral
  movement or credential access. The free Community Edition exposes a public
  REST API (OpenAPI 3.1) for issuing and confirming canary credentials and
  reading alerts and their logs, alongside an open-source CLI, a GitHub Action,
  and a provider-published Agent Skill.
